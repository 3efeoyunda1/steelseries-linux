<svg xmlns="http://www.w3.org/2000/svg" width="64" height="40" viewBox="0 0 64 40" role="img" aria-label="Battery 0% critical, exclamation mark">
  <defs>
    <!-- Real transparency around the exclamation mark: 2.5 SVG units. -->
    <mask id="exclamation-cutout" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="40">
      <rect width="64" height="40" fill="#FFFFFF"/>
      <g fill="#000000" stroke="#000000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
        <rect x="25.1" y="4.2" width="6.8" height="20.7" rx="3.4"/>
        <circle cx="28.5" cy="32" r="3.5"/>
      </g>
    </mask>
  </defs>
  <g mask="url(#exclamation-cutout)">
    <rect x="2.5" y="6" width="52" height="28" rx="5.5" fill="none" stroke="#EF4444" stroke-width="2.8"/>
    <rect x="57" y="13.5" width="5" height="13" rx="2" fill="#EF4444"/>
  </g>
  <g fill="#FFFFFF">
    <rect x="25.1" y="4.2" width="6.8" height="20.7" rx="3.4"/>
    <circle cx="28.5" cy="32" r="3.5"/>
  </g>
</svg>
